<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get the phone app | Control My Mac</title>
  <meta name="description" content="Get the Control My Mac phone app: App Store for iPhone and iPad, Google Play for Android.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/site.css">
  <!--
    The QR code in the download area (assets/qr-app.svg, built by scripts/store-buttons.py) opens this page.
    A phone goes straight to its own store; anything else sees both badges. The ct / referrer values let
    App Store Connect and Play Console count installs that came from the QR code.
  -->
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (ios) { location.replace("https://apps.apple.com/app/id6781458180?pt=129029065&ct=website-qr&mt=8"); }
      else if (/Android/.test(ua)) { location.replace("https://play.google.com/store/apps/details?id=com.controlmymac.controller&referrer=utm_source%3Dcontrolmymac.com%26utm_medium%3Dqr%26utm_campaign%3Ddownload"); }
    })();
  </script>
  <style>
    .ga-wrap { max-width: 560px; margin: 0 auto; padding: 0 var(--sp-xl); min-height: 70vh; display: flex;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-l); }
    .ga-row { display: flex; gap: var(--sp-l); flex-wrap: wrap; justify-content: center; align-items: center; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="ga-wrap">
    <h1 style="font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.1;margin:0">Get the phone app</h1>
    <div class="ga-row">
      <a class="store-badge" href="https://apps.apple.com/app/id6781458180?pt=129029065&amp;ct=website-qr&amp;mt=8" aria-label="Download Control My Mac on the App Store"><img src="/assets/badges/app-store/en.svg" alt="" width="132" height="44"></a>
      <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.controlmymac.controller&amp;referrer=utm_source%3Dcontrolmymac.com%26utm_medium%3Dqr%26utm_campaign%3Ddownload" aria-label="Get Control My PC on Google Play"><img src="/assets/badges/google-play/en.png" alt="" width="169.2" height="65.5" style="width:169.2px;height:65.5px;margin:-10.7px -10.7px"></a>
    </div>
    <p style="color:var(--muted);margin:0">Then get the free app for your computer at <a href="/">controlmymac.com</a>.</p>
  </main>
<script defer src="/assets/i18n.js"></script>
</body>
</html>
